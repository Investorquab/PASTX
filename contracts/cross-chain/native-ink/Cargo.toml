[package]
name = "pastx_budget_market"
version = "0.1.0"
edition = "2021"
authors = ["PASTX Contributors"]
publish = false
license = "MIT"
description = "Compact native pallet-contracts size-feasibility prototype for PASTX"

[dependencies]
ink = { version = "5.1.1", default-features = false }

[dev-dependencies]
ink = { version = "5.1.1", default-features = false, features = ["std"] }

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []

[profile.release]
overflow-checks = false
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
