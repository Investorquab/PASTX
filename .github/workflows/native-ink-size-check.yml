name: PASTX Compact Native Market Size Check

on:
  push:
    branches:
      - main
      - ui/firstbell-inspired-market-terminal
    paths:
      - ".github/workflows/native-ink-size-check.yml"
      - "contracts/cross-chain/native-ink/**"
      - "contracts/cross-chain/native-polkadot/scripts/wasm-exports.cjs"
  pull_request:
    paths:
      - ".github/workflows/native-ink-size-check.yml"
      - "contracts/cross-chain/native-ink/**"
      - "contracts/cross-chain/native-polkadot/scripts/wasm-exports.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-market:
    name: Build and measure compact ink! market
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/cross-chain/native-ink
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/cross-chain/native-ink -> target

      - name: Install Binaryen WASM optimizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
          wasm-opt --version

      - name: Run native market unit tests
        run: cargo test

      - name: Compile optimized no-std WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --no-default-features
          mkdir -p target/ink
          wasm-opt -Oz --strip-debug target/wasm32-unknown-unknown/release/pastx_budget_market.wasm -o target/ink/pastx_budget_market.wasm

      - name: Measure code deposit against Portaldot testnet constants
        run: node scripts/check-size.cjs
