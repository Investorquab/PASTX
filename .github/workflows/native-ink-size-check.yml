name: PASTX Compact Native Market Size Check

on:
  push:
    branches:
      - main
      - ui/firstbell-inspired-market-terminal
    paths:
      - ".github/workflows/native-ink-size-check.yml"
      - "contracts/cross-chain/native-ink/**"
  pull_request:
    paths:
      - ".github/workflows/native-ink-size-check.yml"
      - "contracts/cross-chain/native-ink/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-market:
    name: Build and measure compact ink! market
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/cross-chain/native-ink
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/cross-chain/native-ink -> target

      - name: Install cargo-contract for ink! v5
        run: cargo install cargo-contract --locked --version 5.0.3

      - name: Run native market unit tests
        run: cargo test

      - name: Build size-optimized contract
        run: cargo contract build --release

      - name: Measure code deposit against Portaldot testnet constants
        run: node scripts/check-size.cjs
