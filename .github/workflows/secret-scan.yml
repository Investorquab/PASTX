name: PASTX Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: pastx-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan repository history
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --exit-code 1
