name: Refresh pnpm lockfile on feature pull requests

on:
  pull_request:
    paths:
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/refresh-pnpm-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-pnpm-lock-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate only the lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit updated lockfile to the pull request branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
