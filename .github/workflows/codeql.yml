name: PASTX CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze TypeScript and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          # Private repositories without GitHub Code Security cannot upload SARIF
          # to the Code Scanning UI. Preserve the analysis output as a CI artifact.
          upload: never

      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 14
