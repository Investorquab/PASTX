name: Portaldot Substrate Runtime Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pastx-substrate-runtime-evidence
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only runtime fingerprint and head progression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Probe official Portaldot Substrate endpoint
        id: probe
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          PASTX_METADATA_OUTPUT=evidence/substrate-runtime-metadata.hex node scripts/check-substrate-progress.mjs wss://mainnet.portaldot.io 6 5000 > evidence/substrate-runtime-check.txt 2>&1
          result=$?
          set -e
          cat evidence/substrate-runtime-check.txt
          printf '\nexit_code=%s\n' "$result" >> evidence/substrate-runtime-check.txt
          exit "$result"
      - name: Preserve probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portaldot-substrate-runtime-evidence-${{ github.run_id }}
          path: |
            evidence/substrate-runtime-check.txt
            evidence/substrate-runtime-metadata.hex
          if-no-files-found: error
          retention-days: 14
