name: PASTX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pastx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace checks, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck all packages
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build all packages
        run: pnpm build
