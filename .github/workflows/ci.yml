name: PASTX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pastx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace checks, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Typecheck all packages
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build all packages
        run: pnpm build

      - name: Syntax-check read-only operational scripts
        run: node --check scripts/smoke-test-deployment.mjs && node --check scripts/check-chain-progress.mjs && node --check scripts/check-substrate-progress.mjs && node --check scripts/check-portaldot-v3-testnet.mjs && node --check scripts/check-portaldot-v3-testnet-substrate.mjs && node --check scripts/check-portaldot-v3-testnet-assets.mjs

      - name: Smoke-test bundled API and graceful shutdown
        run: |
          set -euo pipefail
          NODE_ENV=production HOST=127.0.0.1 PORT=4179 node apps/api/dist/server.js > /tmp/pastx-api-smoke.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if response="$(curl --fail --silent http://127.0.0.1:4179/api/health)"; then
              printf '%s' "$response" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const health = JSON.parse(data); if (health.status !== "ok" || health.service !== "pastx-api" || health.tradingEnabled !== false || health.marketDataConfigured !== false || health.marketDataDisplayEnabled !== false) process.exit(1); });'
              capabilities="$(curl --fail --silent http://127.0.0.1:4179/api/capabilities)"
              printf '%s' "$capabilities" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const body = JSON.parse(data); const c = body.capabilities; if (body.safety?.tradingEnabled !== false || c?.walletConnection?.enabled !== false || c?.orderSubmission?.enabled !== false || c?.atomicSettlement?.enabled !== false || c?.marketQuotes?.enabled !== false || c?.marketCandles?.enabled !== false) process.exit(1); });'
              chain="$(curl --fail --silent http://127.0.0.1:4179/api/chain/status)"
              printf '%s' "$chain" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const item = JSON.parse(data).item; if (item?.configured !== false || item?.status !== "not_configured" || item?.blockNumber !== null) process.exit(1); });'
              quote_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4179/api/markets/AAPL/quote)"
              candle_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4179/api/markets/AAPL/candles?interval=1day&outputsize=30')"
              test "$quote_status" = "503"
              test "$candle_status" = "503"
              kill -TERM "$api_pid"
              wait "$api_pid"
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pastx-api-smoke.log
          exit 1
