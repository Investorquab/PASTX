name: PASTX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pastx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace checks, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build all packages
        run: pnpm build

      - name: Smoke-test bundled API
        run: |
          set -euo pipefail
          NODE_ENV=production HOST=127.0.0.1 PORT=4179 node apps/api/dist/server.js > /tmp/pastx-api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if response="$(curl --fail --silent http://127.0.0.1:4179/api/health)"; then
              printf '%s' "$response" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const health = JSON.parse(data); if (health.status !== "ok" || health.service !== "pastx-api" || health.tradingEnabled !== false) process.exit(1); });'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pastx-api-smoke.log
          exit 1
